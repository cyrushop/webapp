name: GPS Simulator CI

on:
  push:
    branches: ['**']
    tags: ['gps-sim-v*']
    paths:
      - 'gps-simulator/**'
      - '.github/workflows/gps-simulator.yml'
  pull_request:
    paths:
      - 'gps-simulator/**'
      - '.github/workflows/gps-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gps-sim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge-tests:
    name: Bridge tests (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gps-simulator/server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gps-simulator/server/package-lock.json
      - run: npm ci
      - run: npm test

  android-apk:
    name: Build APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gps-simulator/android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest ships the Android SDK (ANDROID_HOME) with licenses accepted;
      # AGP downloads any missing platform/build-tools itself.
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -n 12

      # Also validates gradle-wrapper.jar against the official checksums.
      - uses: gradle/actions/setup-gradle@v5

      - name: Decode signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing with the keystore from repository secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set - APK is signed with this runner's throwaway debug key. Uninstall the old app before installing a newer build, or add the signing secrets (see gps-simulator/README.md)."
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Collect APK
        id: apk
        run: |
          name="mock-location-bridge-${GITHUB_SHA::7}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)/apksigner"
          "$apksigner" verify --print-certs "$GITHUB_WORKSPACE/$name" | head -3 | tee -a "$GITHUB_STEP_SUMMARY"
          echo "### APK" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$name\` — $(du -h "$GITHUB_WORKSPACE/$name" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256: \`$(sha256sum "$GITHUB_WORKSPACE/$name" | cut -d' ' -f1)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: mock-location-bridge-apk
          path: ${{ github.workspace }}/${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 30

  mac-app:
    name: Build macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build Pikmin GPS.app
        run: |
          V=0.3.0
          case "$GITHUB_REF" in refs/tags/gps-sim-v*) V="${GITHUB_REF_NAME#gps-sim-v}";; esac
          APP_VERSION="$V" bash gps-simulator/macos/build-app.sh "$RUNNER_TEMP/dist"
      - name: Smoke test (launch the app, load the page, stop it)
        run: |
          set -e
          APP="$RUNNER_TEMP/dist/Pikmin GPS.app"
          # Unzip the artifact exactly as a user would, then launch it via LaunchServices.
          mkdir -p "$RUNNER_TEMP/unzip" && ditto -x -k "$RUNNER_TEMP/dist/PikminGPS-mac.zip" "$RUNNER_TEMP/unzip"
          open "$RUNNER_TEMP/unzip/Pikmin GPS.app"
          for i in $(seq 1 40); do curl -s -o /dev/null -m 1 http://127.0.0.1:8787/ && break; sleep 0.5; done
          curl -fsS http://127.0.0.1:8787/ | grep -q "GPS 定位控制器"
          curl -fsS -o /dev/null http://127.0.0.1:8787/vendor/leaflet/leaflet.js
          curl -fsS -o /dev/null http://127.0.0.1:8787/lib/planting.js
          echo "bridge log:"; cat ~/Library/Logs/PikminGPS/bridge.log || true
          pkill -f "src/server.js" || true
      - uses: actions/upload-artifact@v5
        with:
          name: pikmin-gps-mac
          path: ${{ runner.temp }}/dist/PikminGPS-mac.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/gps-sim-v')
    needs: [bridge-tests, android-apk, mac-app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: assets
          merge-multiple: true
      - name: Stable asset names
        run: |
          cd assets
          mv mock-location-bridge-*.apk MockLocationBridge.apk
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            assets/PikminGPS-mac.zip
            assets/MockLocationBridge.apk
          generate_release_notes: true
          make_latest: true
